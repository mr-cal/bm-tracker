{% extends "base.html" %}
{% block title %}Sign in — bm-tracker{% endblock %}
{% block content %}
<main class="container py-3" role="main" id="main" tabindex="-1">
  <h1>Sign in</h1>

  {% if error %}
  <div class="alert alert-danger" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" >
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div class="mb-3">
      <label for="username">Username</label>
      <input class="form-control" type="text" id="username" name="username" autocomplete="username"
             required autocapitalize="none" autocorrect="off" />
    </div>
    <div class="mb-3">
      <label for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password"
             autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>

  <p class="text-body-secondary">Accounts are created by an admin. There is no sign-up.</p>
</main>
{% endblock %}
