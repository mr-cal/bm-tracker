# The achievement registry.
#
# Adding achievement #301 is a diff in this file. Nothing else has to change:
# the engine reads whatever is here, validates it at startup, and the page
# renders whatever exists. That is the whole reason this is a data file rather
# than a class per achievement.
#
# Rules use a small vocabulary (see rules.py): numeric comparisons, a
# wrap-around `between` for times of day, bare equality, and the combinators
# all / any / not. Anything genuinely novel gets a Python callable in custom.py
# under the same key.
#
# Every achievement is visible from the start. A collection of 300 where most
# are locked behind a name you cannot read is duller than one where the absurdity
# is the point.

[achievement_tiers]
# Points come from the tier, not from each achievement, so the total is bounded
# by arithmetic rather than by my discipline: even unlocking all 300 as
# legendary would be 6,000, against ~5,475 for one perfect year of logging.
common = 2
uncommon = 5
rare = 10
legendary = 20
joke = 25

[[achievement]]
key = "first_blood"
name = "First Blood"
description = "Your first entry, ever."
tier = "common"
icon = "first_blood"
rule.all = [{ bm_count_total = { gte = 1 } }]

[[achievement]]
key = "night_owl"
name = "Late Night Larry"
description = "Logged one between 11pm and 5am."
tier = "common"
icon = "night_owl"
rule.any = [{ time_of_day = { between = ["23:00", "05:00"] } }]

[[achievement]]
key = "early_bird"
name = "The Early Bird"
description = "Logged one before 6am."
