# The corpus `bm-tracker note-achievements calibrate` judges against.
#
# Positives are notes, not descriptions: matching is what is being judged, so
# the things that must match have to be written the way notes are written. A
# threshold tuned against invented positives is tuned against the wrong
# distribution too.
#
# The negatives are what the app actually holds, and they are the important
# half. An achievement that fires on "type 4 again" is worse than one that never
# fires, because a false unlock is public and permanent.

# The shared negatives: ordinary notes that must match nothing.
negatives = [
  "type 4 again",
  "quick one before work",
  "bad coffee",
  "the usual",
  "gut pain, bit better today",
  "long day",
  "slept badly",
  "ate at the cafe",
  "woke up late",
  "traffic was awful",
  "sorted",
  "fine",
  "much the same",
  "rain",
  "ok",
  "felt rough last night",
  "good session at the gym",
  "new place for lunch was decent",
  "the cat was on the bed again",
  "meeting moved to thursday",
  "ran a bit further than usual",
  "nothing much",
  "headache",
  "much better by the evening",
  "quiet day",
  "took the bus",
  "the thing about the thing",
  "all fine",
  "read a couple of pages",
  "made pasta",
  "went to bed early",
  "legs still sore",
  "it was a bit awkward",
  "same as usual",
]

