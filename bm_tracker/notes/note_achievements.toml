# Achievements found by reading a note.

# The only achievements in the app that cost anything to evaluate, and the only
# ones that can be false. Everything else is a count, which is either right or
# not; this is a similarity score, which is a judgement call.

# Three things make them trustworthy enough to ship:
#
#   `semantic` describes the *thing*, not the vocabulary. It is embedded once.
#     Sharing words with the notes you want to match is what a keyword matcher
#     does, and this is meant to be better than that.
#   `examples` sit where a real note sits, which is the main lever on precision.
#     A description says what something is; an example shows what one looks like.
#   `guards` are free and exact. A poem needs lines, an all-caps note needs
#     length and no line breaks, a one-word note needs neither. Checking these
#     before the score is consulted removes most false positives for free.
#
# Thresholds live in the 0.30-0.45 band because that is where related text
# lands on this model. craft-dashboard learned that in production and wrote it
# down; do not read a 0.70 here as "close" and raise these.
#
# After editing:  uv run bm-tracker note-achievements calibrate

[[note_achievement]]
key = "love_poem"
name = "Love Poem"
description = "Wrote something in the notes that is a poem about love or deep affection."
tier = "uncommon"
points = 5
threshold = 0.42
semantic = "a poem expressing romantic love, adoration or longing for a person"
examples = [
  """roses are red
violets are blue
i am still in love with you""",
  """my heart beats only for you
through every night and day
forever is a long time""",
  """when i saw you i forgot
how to breathe
and then i remembered""",
]
guards = { min_words = 8, min_lines = 2 }

