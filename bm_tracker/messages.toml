# ---------------------------------------------------------------------------
# Interface hints.
#
# Same idea and the same rotation as the celebration lines, for the three places
# the log form says something dry: what the optional flags are, how each level of
# effort felt, and what "nothing today" means. Fixed wording on a form you open a
# few times a day stops being a hint and starts being furniture; these rotate
# through the same fair-by-construction rule, so nobody sees the same joke twice
# in a row and everybody eventually sees all of them.
#
# `slot` groups them. A slot is picked from on every render of the log form.

