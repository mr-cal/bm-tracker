# Celebration copy.
#
# Same rule as the achievement registry: adding message #301 is a diff here.
# Every message names a pool, and a pool is chosen by the event that just
# happened — so somebody who always writes notes sees the note lines, and
# somebody who does not sees the general ones.
#
# Rotation is fair by construction, not by luck: within a pool, the line with the
# fewest showings wins, ties broken by longest unseen. Ten days of noting cycles
# every note line before repeating any.

