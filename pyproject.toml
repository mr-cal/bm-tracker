[project]
name = "bm-tracker"
description = "A private daily bowel-movement tracker with streaks, points and achievements."
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0",
    # Imported directly by bm_tracker.notes.embeddings for the embedding calls.
    # It was working locally only because `uvicorn[standard]` happens to pull it
    # in; the container installs the resolved set and got a ModuleNotFoundError
    # on the first request, three deploys after the code that needed it landed.
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "aiosqlite>=0.21",
    "alembic>=1.14",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "tzdata>=2024.1",
    "click>=8.1",
]
requires-python = ">=3.12"
readme = { file = "README.md", content-type = "text/markdown" }

[project.scripts]
bm-tracker = "bm_tracker.cli:main"

[dependency-groups]
lint = [
    "ruff>=0.15.13",
    "ty>=0.0.1a6",
]
types = []
dev = [
    "coverage[toml]~=7.4",
    "pytest~=8.3",
    "pytest-asyncio~=0.25",
    "pytest-cov~=7.0",
    "pytest-mock~=3.12",
    "pytest-timeout~=2.3",
    "httpx",
    "ruff>=0.15.13",
    "build>=1.2",
    "setuptools-scm>=7.1",
]

[build-system]
requires = ["setuptools>=69.0", "setuptools_scm[toml]>=7.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "bm_tracker/_version.py"
version_scheme = "post-release"
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--long",
    "--match",
    "[0-9]*.[0-9]*.[0-9]*",
    "--exclude",
    "*[^0-9.]*",
]

[tool.setuptools.packages.find]
include = ["bm_tracker*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = "tests"
xfail_strict = true
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests driving Puppeteer; skipped unless BM_TRACKER_E2E=1",
    "slow: tests that take a long time to run",
]

[tool.coverage.run]
branch = true
omit = ["tests/**"]

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "if (typing\\.)?TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["bm_tracker", "tests"]
exclude = ["bm_tracker/_version.py"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "D", "UP", "YTT",
    "ANN", "ASYNC",
    "S101", "S102", "S103", "S104", "S105", "S106", "S107",
    "S110", "S113", "S3", "S5", "S602", "S701",
    "BLE", "FBT", "B0", "A", "COM", "C4", "T10",
    "ISC", "ICN", "INP",
    "PIE790", "PIE794", "PIE796", "PIE804", "PIE807", "PIE810",
    "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID",
    "TC001", "TC002", "TC003", "TC004", "TC005",
    "ARG", "PTH", "FIX", "ERA", "PGH", "PL", "TRY",
    "FLY", "PERF",
    "RUF001", "RUF002", "RUF003", "RUF005", "RUF008",
    "B035", "RUF013", "RUF100", "RUF200",
]
ignore = [
    "E501", "D105", "D107", "D203", "D213", "D215",
    "A003", "SIM117", "PLW1641", "COM812", "ISC001", "TRY003",
    "PLR0912", "PLR0915",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
ignore-decorators = [
    "typing.overload",
    "overrides.override",
    "overrides.overrides",
    "typing.override",
    "typing_extensions.override",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "D", "ANN", "ARG", "S101", "S103", "S105", "S106", "S108",
    "FBT001", "PLR0913", "PLR2004", "SLF",
    "TC001", "TC002", "TC003",
]
# FastAPI resolves handler annotations at runtime, and SQLAlchemy resolves
# Mapped[...] annotations when a mapper is configured. The types named in those
# annotations must therefore be importable at runtime even where they appear
# only in annotation position; moving them into a TYPE_CHECKING block breaks
# both at import time, not at type-check time.
"bm_tracker/app.py" = ["B008", "TC001", "TC002", "TC003"]
"bm_tracker/routes/*.py" = ["B008", "PLR0913", "TC001", "TC002", "TC003"]
"bm_tracker/models/*.py" = ["TC001", "TC002", "TC003"]
# The rule tree is parsed TOML and is untyped by nature; the loader validates it
# at startup, which is the check that matters.
"bm_tracker/achievements/*.py" = ["ANN401"]
"bm_tracker/cli.py" = ["ARG001", "PLC0415"]
"bm_tracker/services/*.py" = ["B008", "PLR0913", "S105", "S106", "TC002"]
"alembic/**.py" = ["D", "ANN", "ARG", "INP001", "TC001", "TC002", "TC003"]
"__init__.py" = ["I001", "F401"]

[tool.ty.environment]
python-version = "3.12"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
all = "ignore"

[[tool.ty.overrides]]
include = ["scripts/**"]

[tool.ty.overrides.rules]
all = "ignore"
