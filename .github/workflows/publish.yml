name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one build at a time. Two pushes in quick succession would otherwise
# race to tag the same `latest`, and the loser would leave a stale image
# published under a digest the deploy then pulls.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools_scm derives the version from git metadata, which is not
          # in the container build context.
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.meta.outputs.version }}

      - name: Wake the VPS
        uses: petebacondreywb/dispatch@v4
        with:
          token: ${{ secrets.VPSINFRA_PAT }}
          event-type: bm-tracker-updated
          client-payload: &payload
            image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}
            sha: ${{ github.sha }}
            ref: ${{ github.ref }}
